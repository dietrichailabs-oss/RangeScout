<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RangeScout</title>
  <desc id="desc">RangeScout local market analysis desktop app banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="34" fill="url(#bg)"/>
  <circle cx="1120" cy="95" r="190" fill="#0ea5e9" opacity="0.09"/>
  <circle cx="105" cy="590" r="245" fill="#2563eb" opacity="0.08"/>

  <g transform="translate(72 82)">
    <g filter="url(#glow)">
      <path d="M0 74 C42 26 86 118 132 61 C176 8 222 96 266 40" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="266" cy="40" r="8" fill="#7dd3fc"/>
    </g>
    <text x="0" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="700" fill="#f8fafc">RangeScout</text>
    <text x="2" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#93c5fd">Local market analysis without the noise.</text>
    <text x="2" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#cbd5e1">Charts • Watchlists • Notes • Alerts • Comparisons • CSV exports</text>

    <g transform="translate(0 300)">
      <rect width="188" height="46" rx="23" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="94" y="29" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#e0f2fe">Windows Desktop</text>
      <rect x="202" width="188" height="46" rx="23" fill="#172554" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="296" y="29" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#dbeafe">SEC Research</text>
      <rect x="404" width="144" height="46" rx="23" fill="#172554" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="476" y="29" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#dbeafe">v1.0.0</text>
    </g>

    <text x="2" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#94a3b8">Private by design: local app data, no public live-market provider in v1.0.0.</text>
  </g>

  <g transform="translate(735 104)">
    <rect width="470" height="430" rx="24" fill="#111c2f" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="24" width="422" height="54" rx="12" fill="#172554"/>
    <circle cx="53" cy="51" r="8" fill="#38bdf8"/>
    <text x="78" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">Market Dashboard</text>

    <rect x="24" y="100" width="252" height="190" rx="14" fill="#0f172a" stroke="#334155"/>
    <path d="M44 250 L82 230 L120 242 L158 190 L196 207 L234 145 L258 160" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 270 L44 120 M44 270 L258 270" stroke="#334155" stroke-width="2"/>
    <circle cx="234" cy="145" r="6" fill="#60a5fa"/>

    <rect x="296" y="100" width="150" height="88" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="314" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Watchlists</text>
    <text x="314" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">3</text>

    <rect x="296" y="202" width="150" height="88" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="314" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Alerts</text>
    <text x="314" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Ready</text>

    <rect x="24" y="314" width="422" height="92" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="44" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Local workflow</text>
    <text x="44" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e2e8f0">Analyze • Compare • Note • Export</text>
  </g>
</svg>
