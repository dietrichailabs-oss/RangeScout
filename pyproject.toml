[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rangescout"
version = "1.6.4"
description = "RangeScout desktop market-monitoring and historical-trend application."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "PySide6==6.11.1",
  "PySide6-Addons==6.11.1",
  "PySide6-Essentials==6.11.1",
  "shiboken6==6.11.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "PyInstaller==6.21.0",
]

[project.scripts]
rangescout = "app.ui.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
